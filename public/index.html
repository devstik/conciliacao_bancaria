<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma Financeira</title>
    <link rel="icon" type="image/png" href="assets/favicon-stik.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="login-view" class="login-shell">
      <div class="login-composition">
        <form id="login-form" class="lc-card">
          <div class="lc-logo lc-logo-symbol" aria-label="STIK">
            <img src="assets/logo-stik-symbol.png" alt="STIK" />
          </div>

          <div class="lc-copy">
            <p class="lc-title">Bem-vindo de volta!</p>
            <p class="lc-subtitle">Informe suas credenciais para continuar</p>
          </div>

          <div class="lc-field">
            <svg class="lc-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" stroke="currentColor" stroke-width="1.8"/>
              <path d="M2 6l10 7 10-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input class="lc-input" id="usuario" type="text" placeholder="Usuário" autocomplete="username" required />
          </div>

          <div class="lc-field">
            <svg class="lc-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input class="lc-input" id="senha" type="password" placeholder="Senha" autocomplete="current-password" required />
          </div>

          <button class="lc-btn" type="submit">Entrar</button>
          <small id="login-message" class="lc-msg"></small>
        </form>

        <p class="login-footer">© 2026 STIK. Todos os direitos reservados.</p>
      </div>
    </div>

    <div id="app-view" class="app-shell hidden">
      <aside class="sidebar">
        <div>
          <button id="sidebar-toggle" class="logo" type="button" aria-label="Alternar sidebar">
            <span class="logo-mark logo-mark-image">
              <img src="assets/logo-stik-symbol.png" alt="STIK" />
            </span>
            <span class="logo-text">Financeiro</span>
          </button>
          <nav class="menu" id="menu"></nav>
        </div>
        <div class="account-block">
          <div class="account-row">
            <div class="user-info">
              <div class="user-avatar" id="user-avatar">J</div>
              <strong id="user-name">usuario</strong>
            </div>
            <button class="logout-btn" id="logout-btn" title="Sair" aria-label="Sair">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </aside>
      <button class="ghost-btn mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="Abrir menu">&#9776;</button>
      <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="breadcrumb">Financeiro / Home</p>
            <h2 id="screen-title">Contas a Receber</h2>
          </div>
          <div class="top-actions"></div>
        </header>

        <section id="notifications-panel" class="notifications-panel hidden"></section>

        <section id="receber-screen" class="screen hidden"></section>

        <section id="boletos-screen" class="screen hidden"></section>

        <section id="pagar-screen" class="screen hidden"></section>

        <section id="conciliacao-screen" class="screen hidden"></section>

        <section id="ficha-cliente-screen" class="screen hidden"></section>

        <section id="fluxo-caixa-screen" class="screen hidden"></section>

      </main>
    </div>

    <script src="catalogs.js"></script>
    <script src="app.js"></script>
  </body>
</html>
