<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma Financeira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="login-view" class="login-shell">
      <form id="login-form" class="login-card">
        <div style="width:88px;height:88px;border-radius:50%;background:#0145F2;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#fff;margin:0 auto 12px;flex-shrink:0;">$</div>
        <h2 style="margin:0 0 10px;font-size:22px;font-weight:700;color:#0f172a;text-align:center;width:100%;">Bem-vindo de volta!</h2>

        <div class="login-field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="login-field-icon"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" stroke="currentColor" stroke-width="1.8"/><path d="M2 6l10 7 10-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="usuario" type="text" placeholder="Usuário" autocomplete="username" required />
        </div>

        <div class="login-field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="login-field-icon"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required />
        </div>

        <button type="submit">Entrar</button>
        <small id="login-message"></small>
      </form>
    </div>

    <div id="app-view" class="app-shell hidden">
      <aside class="sidebar">
        <div>
          <button id="sidebar-toggle" class="logo" type="button" aria-label="Alternar sidebar">Financeiro</button>
          <nav class="menu" id="menu"></nav>
        </div>
        <div class="account-block">
          <div class="account-row">
            <strong id="user-name">usuario</strong>
            <button class="ghost-btn sidebar-btn danger" id="logout-btn">Logoff</button>
          </div>
        </div>
      </aside>
      <button class="ghost-btn mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="Abrir menu">&#9776;</button>
      <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="breadcrumb">Financeiro / Home</p>
            <h2 id="screen-title">Overview</h2>
          </div>
          <div class="top-actions">
            <button class="ghost-btn refresh-icon-btn" id="notifications-btn" title="Notificações" aria-label="Notificações">N</button>
            <button class="ghost-btn refresh-icon-btn" id="refresh-btn" title="Atualizar" aria-label="Atualizar">&#x21bb;</button>
          </div>
        </header>

        <section id="notifications-panel" class="notifications-panel hidden"></section>

        <section id="overview-screen" class="screen"></section>

        <section id="receber-screen" class="screen hidden"></section>

        <section id="boletos-screen" class="screen hidden"></section>

        <section id="pagar-screen" class="screen hidden"></section>

        <section id="conciliacao-screen" class="screen hidden"></section>

        <section id="ficha-cliente-screen" class="screen hidden"></section>

        <section id="checkins-screen" class="screen hidden"></section>

        <section id="dolar-analytics-screen" class="screen hidden"></section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
