<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma Financeira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="login-view" class="login-shell">
      <form id="login-form" class="login-card">
        <h1>Login</h1>

        <label for="usuario">Usuário</label>
        <input id="usuario" type="text" placeholder="usuario" required />

        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="senha" required />

        <button type="submit">Entrar</button>
        <small id="login-message"></small>
      </form>
    </div>

    <div id="app-view" class="app-shell hidden">
      <aside class="sidebar">
        <div>
          <button id="sidebar-toggle" class="logo" type="button" aria-label="Alternar sidebar">Financeiro</button>
          <nav class="menu" id="menu"></nav>
        </div>
        <div class="account-block">
          <div class="account-row">
            <strong id="user-name">usuario</strong>
            <button class="ghost-btn sidebar-btn danger" id="logout-btn">Logoff</button>
          </div>
        </div>
      </aside>
      <button class="ghost-btn mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="Abrir menu">&#9776;</button>
      <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="breadcrumb">Financeiro / Home</p>
            <h2 id="screen-title">Overview</h2>
          </div>
          <div class="top-actions">
            <button class="ghost-btn refresh-icon-btn" id="notifications-btn" title="Notificações" aria-label="Notificações">N</button>
            <button class="ghost-btn refresh-icon-btn" id="refresh-btn" title="Atualizar" aria-label="Atualizar">&#x21bb;</button>
          </div>
        </header>

        <section id="notifications-panel" class="notifications-panel hidden"></section>

        <section id="overview-screen" class="screen"></section>

        <section id="receber-screen" class="screen hidden"></section>

        <section id="boletos-screen" class="screen hidden"></section>

        <section id="pagar-screen" class="screen hidden"></section>

        <section id="conciliacao-screen" class="screen hidden"></section>

        <section id="ficha-cliente-screen" class="screen hidden"></section>

        <section id="checkins-screen" class="screen hidden"></section>

        <section id="dolar-analytics-screen" class="screen hidden"></section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
